            <div class="logo-branding-container">
                <div class="logo-icons-col">
                    <div class="logo-heart-wrapper">
                        <svg class="header-logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Neon pink heart outline -->
                            <path d="M 50,85 C 28,70 15,52 15,36 C 15,22 25,14 36,18 C 42,20 46,26 48,30 C 50,31 50,31 52,30 C 54,26 58,20 64,18 C 75,14 85,22 85,36 C 85,52 72,70 50,85 Z" stroke="#ff69b4" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

                            <circle cx="38" cy="14" r="5.5" fill="#ff69b4" filter="url(#glow)"/>
                            <circle cx="62" cy="14" r="5.5" fill="#ff69b4" filter="url(#glow)"/>
                            <defs>
                                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="3.5" result="blur"/>
                                    <feMerge>
                                        <feMergeNode in="blur"/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                            </defs>
                        </svg>
                    </div>
                    <div class="logo-sparkle-wrapper">
                        <svg class="header-sparkle-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Main 4-pointed star with radial gradient fill -->
                            <path d="M 50,12 Q 50,50 12,50 Q 50,50 50,88 Q 50,50 88,50 Q 50,50 50,12 Z" fill="url(#star-grad)" filter="url(#gold-glow)"/>
                            <!-- Secondary small star -->

                            <!-- Smallest sparkle dot -->
                            <circle cx="30" cy="28" r="3" fill="#ffffff" opacity="0.8" filter="url(#gold-glow)"/>
                            <defs>
                                <radialGradient id="star-grad" cx="50%" cy="50%" r="50%">
                                    <stop offset="0%" stop-color="#ffffff"/>
                                    <stop offset="35%" stop-color="#ffeaad"/>
                                    <stop offset="100%" stop-color="#ffc83b"/>
                                </radialGradient>
                                <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
                                    <feGaussianBlur stdDeviation="4" result="blur"/>
                                    <feMerge>
                                        <feMergeNode in="blur"/>
                                        <feMergeNode in="SourceGraphic"/>
                                    </feMerge>
                                </filter>
                            </defs>
                        </svg>
